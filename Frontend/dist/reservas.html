        <!--begin::App Content-->
        <div class="app-content">
          <!--begin::Container-->
          <div class="container-fluid">
            <div class="card">
              <div class="card-body">
                <form action="" id="frmVuelo">
                  <div class="">
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="opcionVuelo"
                        id="ida"
                        value="ida"
                        checked
                      />
                      <label class="form-check-label" for="ida">Ida</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="opcionVuelo"
                        id="idaVuelta"
                        value="idaVuelta"
                      />
                      <label class="form-check-label" for="idaVuelta"
                        >Ida y vuelta</label
                      >
                    </div>
                  </div>

                  <div class="row" id="fechaRow">
                    <!-- Columna para Origen y Destino -->
                    <div class="col-sm-6">
                      <div class="input-group mt-4">
                        <span class="input-group-text"
                          ><i class="fa-solid fa-plane-departure"></i
                        ></span>
                        <input
                          type="text"
                          id="origen"
                          class="form-control"
                          placeholder="Origen"
                          aria-label="origen"
                        />
                        <span class="input-group-text"
                          ><i class="fa-solid fa-plane-arrival"></i
                        ></span>
                        <input
                          id="destino"
                          type="text"
                          class="form-control"
                          placeholder="Destino"
                          aria-label="Destino"
                        />
                      </div>
                    </div>

                    <!-- Columna para Fecha Ida -->
                    <div class="col-sm-2">
                      <label for="fechaIda">Ida</label>
                      <input
                        class="form-control"
                        type="date"
                        name="fechaIda"
                        id="fechaIda"
                      />
                    </div>

                    <!-- Columna para Personas -->
                    <div class="col-sm-2">
                      <label for="">Personas</label>
                      <div class="input-group">
                        <span class="input-group-text"
                          ><i class="fa-solid fa-user-plus"></i
                        ></span>
                        <select
                          class="form-select"
                          name="personas"
                          id="personas"
                        >
                          <option value="1" selected>1</option>
                          <option value="2">2</option>
                          <option value="3">3</option>
                          <option value="4">4</option>
                          <option value="5">5</option>
                        </select>
                      </div>
                    </div>

                    <!-- Columna para el botón Buscar -->
                    <div class="col-sm-12 mt-4">
                      <button
                       
                        class="btn btn-primary w-100 fw-bolder"
                      >
                        Buscar
                      </button>
                    </div>
                  </div>
                </form>
              </div>
